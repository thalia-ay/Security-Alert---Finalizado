{% extends "base.html" %}
{% block title %}Redefinir Senha - Security Alert{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">🔐</span>
            <h2>Redefinir Senha</h2>
            <p>Digite seu email e escolha uma nova senha.</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Email cadastrado</label>
                <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
            </div>
            <div class="form-group">
                <label for="new_password">Nova Senha</label>
                <input type="password" id="new_password" name="new_password" placeholder="Minimo 6 caracteres" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm">Confirmar Nova Senha</label>
                <input type="password" id="confirm" name="confirm" placeholder="Repita a nova senha" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Redefinir Senha</button>
        </form>
        <div class="auth-footer">
            <p><a href="{{ url_for('login') }}">Voltar para o login</a></p>
        </div>
    </div>
</div>
{% endblock %}
